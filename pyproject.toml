[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitblaze"
version = "1.0.0"
description = "42 git shortcuts + auto merge conflict resolver — zero AI, pure Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7"
dependencies = []

authors = [
    { name = "Ekaanksh Patil", email = "pekanksh@gmail.com" }
]

keywords = [
    "git",
    "shortcuts",
    "developer-tools",
    "merge",
    "cli",
    "productivity"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitfast = "gitfast.cli:main"
ghelp   = "gitfast.cli:help_cmd"
gmerge  = "gitfast.merge.resolver:main"

[project.urls]
Homepage = "https://github.com/Ekaanksh-dev/gitfast"
Issues   = "https://github.com/Ekaanksh-dev/gitfast/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitfast*"]
